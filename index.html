<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수업 태도 관찰 기록</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap');
        body { font-family: 'Nanum Gothic', sans-serif; background-color: #f0fdf4; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .btn-hover { transition: all 0.2s ease-in-out; }
        .btn-hover:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-start text-gray-800">

    <div class="w-full max-w-lg glass-card overflow-hidden">
        <!-- Header -->
        <div class="bg-green-500 p-6 text-white text-center relative rounded-t-[20px]">
            <h1 class="text-2xl font-bold mb-2"><i class="fa-solid fa-seedling mr-2"></i><span id="schoolNameDisplay">OO학교</span> 관찰 기록</h1>
            <p class="text-green-100 text-sm">학생들의 소중한 성장을 기록해주세요</p>
        </div>
        
        <!-- Info Banner -->
        <div class="bg-green-100 text-green-800 text-xs text-center py-2 border-b border-green-200">
            개발자: 가치있는 미래교육 연구소 대표 김병찬
        </div>

        <div class="p-6">
            <form id="observationForm" class="space-y-5">
                
                <!-- 교사 선택 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1"><i class="fa-solid fa-chalkboard-user mr-1 text-green-500"></i> 기록 교사</label>
                    <select id="teacherSelect" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent appearance-none bg-white">
                        <option value="" disabled selected>교사명을 선택하세요</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <!-- 학급 선택 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1"><i class="fa-solid fa-users-class mr-1 text-green-500"></i> 학급</label>
                        <select id="classSelect" required class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent appearance-none bg-white">
                            <option value="" disabled selected>학급 선택</option>
                        </select>
                    </div>

                    <!-- 학생 선택 -->
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1"><i class="fa-solid fa-user-graduate mr-1 text-green-500"></i> 학생 이름</label>
                        <select id="studentSelect" required disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent appearance-none bg-gray-50 text-gray-500">
                            <option value="" disabled selected>학생 선택</option>
                        </select>
                    </div>
                </div>

                <!-- 관찰 종류 (칭찬/지적) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2"><i class="fa-solid fa-magnifying-glass mr-1 text-green-500"></i> 관찰 종류</label>
                    <div class="flex space-x-4">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="obsType" value="칭찬" required class="peer sr-only">
                            <div class="rounded-xl border-2 border-gray-200 p-3 text-center peer-checked:border-blue-500 peer-checked:bg-blue-50 transition-all">
                                <i class="fa-solid fa-thumbs-up text-blue-500 text-xl mb-1 block"></i>
                                <span class="font-bold text-blue-700">칭찬</span>
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="obsType" value="지적" required class="peer sr-only">
                            <div class="rounded-xl border-2 border-gray-200 p-3 text-center peer-checked:border-red-500 peer-checked:bg-red-50 transition-all">
                                <i class="fa-solid fa-circle-exclamation text-red-500 text-xl mb-1 block"></i>
                                <span class="font-bold text-red-700">지적</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- 관찰 내용 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1"><i class="fa-solid fa-pen mr-1 text-green-500"></i> 관찰 내용</label>
                    <textarea id="obsContent" required rows="4" placeholder="학생의 태도나 행동을 구체적으로 기록해주세요." class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent resize-none bg-white"></textarea>
                </div>

                <!-- 제출 버튼 -->
                <button type="submit" id="submitBtn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-xl shadow-lg btn-hover flex justify-center items-center">
                    <span id="btnText">전송하기 <i class="fa-regular fa-paper-plane ml-1"></i></span>
                    <i id="btnLoading" class="fa-solid fa-spinner fa-spin hidden"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 알림 모달 -->
    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none flex items-center z-50">
        <i id="toastIcon" class="fa-solid fa-check-circle text-green-400 mr-2"></i>
        <span id="toastMsg">기록이 성공적으로 전송되었습니다!</span>
    </div>

    <script>
        // ✅ 여기에 선생님의 실제 웹앱 URL이 올바르게 설정되었습니다.
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbygDCRwbgUvqw5sp-RJJhT0hslD2o9EQ4Io0tPDIE9BI10oJCe6xWkxlTZzWutdCxQ/exec'; 
        
        let globalClassesData = {};

        // DOM 요소
        const teacherSelect = document.getElementById('teacherSelect');
        const classSelect = document.getElementById('classSelect');
        const studentSelect = document.getElementById('studentSelect');
        const submitBtn = document.getElementById('submitBtn');
        const form = document.getElementById('observationForm');

        // 초기 데이터 로드
        async function fetchInitData() {
            showToast("데이터를 동기화 중입니다...", "fa-sync fa-spin", "text-blue-400");
            
            // URL 미입력 시 프리뷰(Mock) 데이터 제공 조건문 수정 완료
            if (SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbygDCRwbgUvqw5sp-RJJhT0hslD2o9EQ4Io0tPDIE9BI10oJCe6xWkxlTZzWutdCxQ/exec' || !SCRIPT_URL.startsWith('http')) {
                setTimeout(() => {
                    document.getElementById('schoolNameDisplay').innerText = "테스트(미연동)";
                    globalClassesData = {
                        "1학년 1반": ["김학생", "이학생", "박학생"],
                        "1학년 2반": ["최학생", "정학생"]
                    };
                    
                    const mockTeachers = ["김교사", "이교사", "박교사"];
                    mockTeachers.forEach(teacher => {
                        const option = document.createElement('option');
                        option.value = teacher; option.textContent = teacher;
                        teacherSelect.appendChild(option);
                    });

                    Object.keys(globalClassesData).forEach(className => {
                        const option = document.createElement('option');
                        option.value = className; option.textContent = className;
                        classSelect.appendChild(option);
                    });

                    showToast("미리보기 모드로 실행되었습니다. (URL 미설정)", "fa-info-circle", "text-blue-400");
                    setTimeout(hideToast, 3000);
                }, 500);
                return;
            }

            try {
                const response = await fetch(`${SCRIPT_URL}?action=getInitData`);
                const data = await response.json();
                
                document.getElementById('schoolNameDisplay').innerText = data.schoolName;
                globalClassesData = data.classesData;

                // 교사 목록 세팅
                data.teachers.forEach(teacher => {
                    const option = document.createElement('option');
                    option.value = teacher; option.textContent = teacher;
                    teacherSelect.appendChild(option);
                });

                // 학급 목록 세팅
                Object.keys(globalClassesData).forEach(className => {
                    const option = document.createElement('option');
                    option.value = className; option.textContent = className;
                    classSelect.appendChild(option);
                });
                
                showToast("동기화 완료!", "fa-check-circle", "text-green-400");
                setTimeout(hideToast, 2000);
            } catch (error) {
                console.error("Data Load Error:", error);
                showToast("데이터를 불러오는데 실패했습니다.", "fa-exclamation-triangle", "text-red-400");
            }
        }

        // 학급 선택 시 학생 목록 업데이트
        classSelect.addEventListener('change', (e) => {
            const selectedClass = e.target.value;
            studentSelect.innerHTML = '<option value="" disabled selected>학생 선택</option>';
            
            if (selectedClass && globalClassesData[selectedClass]) {
                studentSelect.disabled = false;
                studentSelect.classList.remove('bg-gray-50', 'text-gray-500');
                studentSelect.classList.add('bg-white');
                
                globalClassesData[selectedClass].forEach(student => {
                    const option = document.createElement('option');
                    option.value = student; option.textContent = student;
                    studentSelect.appendChild(option);
                });
            } else {
                studentSelect.disabled = true;
            }
        });

        // 데이터 전송
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const teacher = teacherSelect.value;
            const className = classSelect.value;
            const student = studentSelect.value;
            const type = document.querySelector('input[name="obsType"]:checked').value;
            const content = document.getElementById('obsContent').value;

            // 버튼 로딩 상태
            document.getElementById('btnText').classList.add('hidden');
            document.getElementById('btnLoading').classList.remove('hidden');
            submitBtn.disabled = true;

            // URL 미입력 시 프리뷰(Mock) 전송 처리 조건문 수정 완료
            if (SCRIPT_URL === 'https://script.google.com/macros/s/AKfycbygDCRwbgUvqw5sp-RJJhT0hslD2o9EQ4Io0tPDIE9BI10oJCe6xWkxlTZzWutdCxQ/exec' || !SCRIPT_URL.startsWith('http')) {
                setTimeout(() => {
                    showToast("미리보기: 전송 완료! (실제 저장 안됨)", "fa-check-circle", "text-green-400");
                    document.getElementById('obsContent').value = '';
                    document.querySelectorAll('input[name="obsType"]').forEach(r => r.checked = false);
                    studentSelect.innerHTML = '<option value="" disabled selected>학생 선택</option>';
                    studentSelect.disabled = true;
                    classSelect.value = '';
                    teacherSelect.value = '';
                    
                    document.getElementById('btnText').classList.remove('hidden');
                    document.getElementById('btnLoading').classList.add('hidden');
                    submitBtn.disabled = false;
                    setTimeout(hideToast, 3000);
                }, 800);
                return;
            }

            const payload = {
                action: 'saveRecord',
                teacher: teacher,
                className: className,
                student: student,
                type: type,
                content: content
            };

            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // GAS CORS 우회
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if(result.status === 'success') {
                    showToast("기록이 성공적으로 전송되었습니다!", "fa-check-circle", "text-green-400");
                    // 폼 초기화 후 대기 모드
                    document.getElementById('obsContent').value = '';
                    document.querySelectorAll('input[name="obsType"]').forEach(r => r.checked = false);
                    studentSelect.value = '';
                    setTimeout(hideToast, 3000);
                } else {
                    throw new Error("서버 에러");
                }
            } catch (error) {
                console.error(error);
                showToast("전송에 실패했습니다. 다시 시도해주세요.", "fa-xmark-circle", "text-red-400");
                setTimeout(hideToast, 3000);
            } finally {
                // 버튼 복구
                document.getElementById('btnText').classList.remove('hidden');
                document.getElementById('btnLoading').classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        // 토스트 알림 함수
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toastIcon');
        function showToast(msg, iconClass, colorClass) {
            document.getElementById('toastMsg').innerText = msg;
            toastIcon.className = `fa-solid ${iconClass} ${colorClass} mr-2`;
            toast.classList.remove('opacity-0');
        }
        function hideToast() {
            toast.classList.add('opacity-0');
        }

        // 앱 시작 시 데이터 호출
        window.onload = fetchInitData;
    </script>
</body>
</html>
